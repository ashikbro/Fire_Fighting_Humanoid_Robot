<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FireOps Cloud</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 2c2 6 9 9 9 17a9 9 0 0 1-18 0c0-5 3-7 4-11 1 3 3 4 3 4 1-4 0-7 2-10z' fill='%23ff6b35'/></svg>">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <!-- Auth -->
  <section id="auth" class="auth hidden">
    <div class="auth-card">
      <div class="brand big"><span class="logo"></span>FireOps <b>Cloud</b></div>
      <p class="muted">Command center for fire-fighting robot fleets.</p>
      <div class="tabs" id="auth-tabs">
        <button class="tab active" data-mode="login">Sign in</button>
        <button class="tab" data-mode="signup">Create organization</button>
      </div>
      <form id="auth-form" autocomplete="on">
        <label class="signup-only">Organization<input name="org_name" placeholder="Dhaka Fire Response Unit"></label>
        <label class="signup-only">Your name<input name="name" placeholder="Jane Doe"></label>
        <label>Email<input name="email" type="email" required autocomplete="email"></label>
        <label>Password<input name="password" type="password" required minlength="8" autocomplete="current-password"></label>
        <div class="error" id="auth-error"></div>
        <button class="btn primary wide" type="submit" id="auth-submit">Sign in</button>
      </form>
    </div>
  </section>

  <!-- App shell -->
  <section id="app" class="shell hidden">
    <aside class="sidebar">
      <div class="brand"><span class="logo"></span>FireOps <b>Cloud</b></div>
      <nav id="nav">
        <a data-view="command" class="active">Command center</a>
        <a data-view="fleet">Fleet</a>
        <a data-view="incidents">Incidents <span class="pill" id="nav-incidents"></span></a>
        <a data-view="commands">Commands</a>
        <a data-view="rules">Alert rules</a>
        <a data-view="analytics">Analytics</a>
        <a data-view="settings">Settings</a>
      </nav>
      <div class="sidebar-foot">
        <div id="org-name" class="org"></div>
        <div><span id="plan-badge" class="badge"></span> <span id="live" class="live off">offline</span></div>
        <div id="user-name" class="muted small"></div>
        <button class="btn ghost small" id="logout">Sign out</button>
      </div>
    </aside>
    <main id="view" class="view"></main>
  </section>

  <div id="drawer" class="drawer hidden"><div class="drawer-panel" id="drawer-panel"></div></div>
  <div id="modal" class="modal hidden"><div class="modal-card" id="modal-card"></div></div>
  <div id="toasts" class="toasts"></div>

  <script src="/static/app.js"></script>
</body>
</html>
