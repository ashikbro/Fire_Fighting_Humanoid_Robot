name: Fire Fighting Robot CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgl1-mesa-glx \
          libglib2.0-0 \
          libsm6 \
          libxext6 \
          libxrender-dev \
          libgomp1 \
          libgtk-3-0

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov

    - name: Create environment file
      run: |
        cp .env.example .env
        echo "REDIS_URL=redis://localhost:6379" >> .env

    - name: Initialize database
      run: |
        python scripts/init_database.py

    - name: Generate security keys
      run: |
        python scripts/generate_security_keys.py

    - name: Run unit tests
      run: |
        pytest tests/test_*.py -v --cov=app --cov-report=xml --cov-report=html

    - name: Run integration tests
      run: |
        pytest tests/test_integration.py -v

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy

    - name: Run flake8
      run: |
        flake8 app/ automation/ vision/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 app/ automation/ vision/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check code formatting with black
      run: |
        black --check app/ automation/ vision/ scripts/

    - name: Check import sorting with isort
      run: |
        isort --check-only app/ automation/ vision/ scripts/

    - name: Run type checking with mypy
      run: |
        mypy app/ --ignore-missing-imports

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run bandit security linter
      run: |
        bandit -r app/ automation/ vision/ scripts/ -f json -o bandit-report.json || true

    - name: Check for known security vulnerabilities
      run: |
        safety check --json --output safety-report.json || true

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  docker:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build -t fire-fighting-robot:test .

    - name: Test Docker image
      run: |
        docker run --rm -d --name test-container -p 8000:8000 fire-fighting-robot:test
        sleep 10
        curl -f http://localhost:8000/health || exit 1
        docker stop test-container

    - name: Log in to Docker Hub
      if: github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      if: github.ref == 'refs/heads/main'
      run: |
        docker tag fire-fighting-robot:test ${{ secrets.DOCKER_USERNAME }}/fire-fighting-robot:latest
        docker tag fire-fighting-robot:test ${{ secrets.DOCKER_USERNAME }}/fire-fighting-robot:${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/fire-fighting-robot:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/fire-fighting-robot:${{ github.sha }}

  mobile-app:
    name: Mobile App Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'

    - name: Get Flutter dependencies
      working-directory: mobile_app
      run: flutter pub get

    - name: Analyze Flutter code
      working-directory: mobile_app
      run: flutter analyze

    - name: Run Flutter tests
      working-directory: mobile_app
      run: flutter test

    - name: Build APK
      working-directory: mobile_app
      run: flutter build apk --debug

  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-glx libglib2.0-0
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up environment
      run: |
        cp .env.example .env
        echo "REDIS_URL=redis://localhost:6379" >> .env
        python scripts/init_database.py
        python scripts/generate_security_keys.py

    - name: Start API server
      run: |
        uvicorn app.api.documented_api:app --host 0.0.0.0 --port 8000 &
        sleep 10

    - name: Run performance tests
      run: |
        python tests/test_performance.py

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, lint, security, docker, performance]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to production
      run: |
        echo "🚀 Deploying to production environment..."
        echo "This would typically involve:"
        echo "- Updating server configurations"
        echo "- Rolling out new Docker containers"
        echo "- Running database migrations"
        echo "- Health checks"
        echo "- Rollback procedures if needed"

    - name: Notify deployment
      run: |
        echo "✅ Deployment completed successfully"
        echo "📊 Performance metrics will be monitored"
