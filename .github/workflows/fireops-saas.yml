name: FireOps Cloud

on:
  push:
    paths: ["saas/**", ".github/workflows/fireops-saas.yml"]
  pull_request:
    paths: ["saas/**", ".github/workflows/fireops-saas.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
