version: '3.8'

services:
  # Main API Service
  fire-robot-api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: fire-robot-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - DEBUG=false
      - DATABASE_URL=sqlite:///app/firebot.db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - API_SECRET_KEY=${API_SECRET_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
    volumes:
      - ./app/firebot.db:/app/firebot.db
      - ./logs:/app/logs
      - fire-robot-data:/app/data
    depends_on:
      - redis
      - nginx
    networks:
      - fire-robot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: fire-robot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - fire-robot-network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: fire-robot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - fire-robot-api
    networks:
      - fire-robot-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Database Backup Service
  db-backup:
    image: alpine:latest
    container_name: fire-robot-backup
    restart: unless-stopped
    volumes:
      - ./app:/app:ro
      - ./backups:/backups
    networks:
      - fire-robot-network
    command: >
      sh -c "
        apk add --no-cache sqlite &&
        while true; do
          timestamp=$$(date +%Y%m%d_%H%M%S) &&
          sqlite3 /app/firebot.db '.backup /backups/firebot_backup_$$timestamp.db' &&
          echo 'Database backup created: firebot_backup_$$timestamp.db' &&
          find /backups -name '*.db' -mtime +7 -delete &&
          sleep 3600
        done
      "

  # Log Aggregation Service
  fluentd:
    image: fluent/fluentd:v1.16-debian-1
    container_name: fire-robot-logs
    restart: unless-stopped
    volumes:
      - ./logs:/fluentd/log
      - ./fluentd/fluent.conf:/fluentd/etc/fluent.conf:ro
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    networks:
      - fire-robot-network

  # Monitoring Service
  prometheus:
    image: prom/prometheus:latest
    container_name: fire-robot-monitoring
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - fire-robot-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Metrics Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: fire-robot-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - fire-robot-network
    depends_on:
      - prometheus

  # Hardware Interface Service (when deployed on robot)
  hardware-interface:
    build:
      context: .
      dockerfile: Dockerfile.hardware
    container_name: fire-robot-hardware
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0  # Arduino/sensors
      - /dev/video0:/dev/video0    # Camera
    volumes:
      - /dev:/dev
      - ./hardware_config:/app/config:ro
    networks:
      - fire-robot-network
    environment:
      - HARDWARE_MODE=production
      - API_ENDPOINT=http://fire-robot-api:8000
    depends_on:
      - fire-robot-api

volumes:
  fire-robot-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  fire-robot-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
